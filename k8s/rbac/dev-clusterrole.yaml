# RBAC - Dev ClusterRole: grants Headlamp permission to list namespaces
# Mirrors: helm/sneakerhead/values-dev.yaml → rbac.clusterRole.name
# Required by Headlamp to populate the namespace dropdown for sneakerhead-dev
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sneakerhead-dev-ns-viewer
  labels:
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
