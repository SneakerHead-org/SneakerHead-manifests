# Order Service ConfigMap - prod (non-sensitive env vars)
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: sneakerhead-prod
  labels:
    app: order-service
    app.kubernetes.io/part-of: sneakerhead
    environment: prod
data:
  JWT_ALGORITHM: "HS256"
  LOG_LEVEL: "INFO"
  USER_SERVICE_URL: "http://user-service:8001"
  PRODUCT_SERVICE_URL: "http://product-service:8002"
---
# Order Service Secret - prod (sensitive env vars)
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: sneakerhead-prod
  labels:
    app: order-service
    app.kubernetes.io/part-of: sneakerhead
    environment: prod
type: Opaque
data:
  # echo -n "postgresql+asyncpg://sneaker:sneakerpass123@order-postgres:5432/orderdb" | base64
  DATABASE_URL: cG9zdGdyZXNxbCthc3luY3BnOi8vc25lYWtlcjpzbmVha2VycGFzczEyM0BvcmRlci1wb3N0Z3Jlczo1NDMyL29yZGVyZGI=
  # echo -n "your-super-secret-jwt-key-change-in-production" | base64
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
---
# Order Service Deployment - prod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: sneakerhead-prod
  labels:
    app: order-service
    tier: backend
    app.kubernetes.io/part-of: sneakerhead
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: order-service
        tier: backend
        app.kubernetes.io/part-of: sneakerhead
        environment: prod
    spec:
      containers:
        - name: order-service
          image: yaswanthreddy1602/sneakerhead-order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              protocol: TCP
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
---
# Order Service - prod (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: sneakerhead-prod
  labels:
    app: order-service
    tier: backend
    app.kubernetes.io/part-of: sneakerhead
    environment: prod
spec:
  type: NodePort
  selector:
    app: order-service
    tier: backend
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP
      name: http
