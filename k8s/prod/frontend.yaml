# Frontend ConfigMap - prod (non-sensitive env vars only)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: sneakerhead-prod
  labels:
    app: frontend-service
    app.kubernetes.io/part-of: sneakerhead
    environment: prod
data:
  VITE_API_URL: "/api/v1"
---
# Frontend Deployment - prod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: sneakerhead-prod
  labels:
    app: frontend-service
    tier: frontend
    app.kubernetes.io/part-of: sneakerhead
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
      tier: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend-service
        tier: frontend
        app.kubernetes.io/part-of: sneakerhead
        environment: prod
    spec:
      containers:
        - name: frontend
          image: yaswanthreddy1602/sneakerhead-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
# Frontend Service - prod (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: sneakerhead-prod
  labels:
    app: frontend-service
    tier: frontend
    app.kubernetes.io/part-of: sneakerhead
    environment: prod
spec:
  type: ClusterIP
  selector:
    app: frontend-service
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
---
# HPA for Frontend - prod
# CPU: 60%, Memory: 70%, min: 2, max: 10
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: sneakerhead-prod
  labels:
    app: frontend-service
    app.kubernetes.io/part-of: sneakerhead
    environment: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
