# Product Service ConfigMap - dev (non-sensitive env vars)
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: sneakerhead-dev
  labels:
    app: product-service
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
data:
  JWT_ALGORITHM: "HS256"
  LOG_LEVEL: "DEBUG"
---
# Product Service Secret - dev (sensitive env vars)
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secret
  namespace: sneakerhead-dev
  labels:
    app: product-service
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
type: Opaque
data:
  # echo -n "postgresql+asyncpg://sneaker:sneakerpass123@product-postgres:5432/productdb" | base64
  DATABASE_URL: cG9zdGdyZXNxbCthc3luY3BnOi8vc25lYWtlcjpzbmVha2VycGFzczEyM0Bwcm9kdWN0LXBvc3RncmVzOjU0MzIvcHJvZHVjdGRi
  # echo -n "your-super-secret-jwt-key-change-in-production" | base64
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
---
# Product Service Deployment - dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: sneakerhead-dev
  labels:
    app: product-service
    tier: backend
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: product-service
        tier: backend
        app.kubernetes.io/part-of: sneakerhead
        environment: dev
    spec:
      containers:
        - name: product-service
          image: yaswanthreddy1602/sneakerhead-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: product-service-config
            - secretRef:
                name: product-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
---
# Product Service - dev (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: sneakerhead-dev
  labels:
    app: product-service
    tier: backend
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  type: NodePort
  selector:
    app: product-service
    tier: backend
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
      name: http
