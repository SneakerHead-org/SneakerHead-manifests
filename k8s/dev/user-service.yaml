# User Service ConfigMap - dev (non-sensitive env vars)
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: sneakerhead-dev
  labels:
    app: user-service
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
data:
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  LOG_LEVEL: "DEBUG"
---
# User Service Secret - dev (sensitive env vars)
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: sneakerhead-dev
  labels:
    app: user-service
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
type: Opaque
data:
  # echo -n "postgresql+asyncpg://sneaker:sneakerpass123@user-postgres:5432/userdb" | base64
  DATABASE_URL: cG9zdGdyZXNxbCthc3luY3BnOi8vc25lYWtlcjpzbmVha2VycGFzczEyM0B1c2VyLXBvc3RncmVzOjU0MzIvdXNlcmRi
  # echo -n "your-super-secret-jwt-key-change-in-production" | base64
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
---
# User Service Deployment - dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: sneakerhead-dev
  labels:
    app: user-service
    tier: backend
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-service
        tier: backend
        app.kubernetes.io/part-of: sneakerhead
        environment: dev
    spec:
      containers:
        - name: user-service
          image: yaswanthreddy1602/sneakerhead-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
---
# User Service - dev (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: sneakerhead-dev
  labels:
    app: user-service
    tier: backend
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: user-service
    tier: backend
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
