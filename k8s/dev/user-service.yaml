# User Service ConfigMap - dev (non-sensitive env vars)
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: sneakerhead-dev
  labels:
    app: user-service
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
data:
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  LOG_LEVEL: "DEBUG"
---
# User Service SealedSecret - dev
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: user-service-secret
  namespace: sneakerhead-dev
  labels:
    app: user-service
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  encryptedData:
    DATABASE_URL: 
    JWT_SECRET: 
  template:
    metadata:
      name: user-service-secret
      namespace: sneakerhead-dev
    type: Opaque
---
# User Service Deployment - dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: sneakerhead-dev
  labels:
    app: user-service
    tier: backend
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-service
        tier: backend
        app.kubernetes.io/part-of: sneakerhead
        environment: dev
    spec:
      containers:
        - name: user-service
          image: yaswanthreddy1602/sneakerhead-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
---
# User Service - dev (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: sneakerhead-dev
  labels:
    app: user-service
    tier: backend
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: user-service
    tier: backend
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
