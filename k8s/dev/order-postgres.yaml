# Order PostgreSQL ConfigMap - dev
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-postgres-config
  namespace: sneakerhead-dev
  labels:
    app: order-postgres
    tier: data
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
data:
  PGDATA: "/var/lib/postgresql/data/pgdata"
  POSTGRES_DB: "orderdb"
---
# Order PostgreSQL Secret - dev
apiVersion: v1
kind: Secret
metadata:
  name: order-postgres-secret
  namespace: sneakerhead-dev
  labels:
    app: order-postgres
    tier: data
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
type: Opaque
data:
  # echo -n "sneaker" | base64
  POSTGRES_USER: c25lYWtlcg==
  # echo -n "sneakerpass123" | base64
  POSTGRES_PASSWORD: c25lYWtlcnBhc3MxMjM=
---
# Order PostgreSQL StatefulSet - dev
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-postgres
  namespace: sneakerhead-dev
  labels:
    app: order-postgres
    tier: data
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  serviceName: order-postgres
  replicas: 1
  selector:
    matchLabels:
      app: order-postgres
      tier: data
  template:
    metadata:
      labels:
        app: order-postgres
        tier: data
        app.kubernetes.io/part-of: sneakerhead
        environment: dev
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: order-postgres-config
            - secretRef:
                name: order-postgres-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: order-postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - sneaker
                - -d
                - orderdb
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - sneaker
                - -d
                - orderdb
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: order-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs
        resources:
          requests:
            storage: 5Gi
---
# Order PostgreSQL Headless Service - dev
apiVersion: v1
kind: Service
metadata:
  name: order-postgres
  namespace: sneakerhead-dev
  labels:
    app: order-postgres
    tier: data
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: order-postgres
    tier: data
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
