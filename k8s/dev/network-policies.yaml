# Network Policies - dev
# Default deny all ingress and egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: sneakerhead-dev
  labels:
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Gateway: ingress from anywhere on port 80, egress to frontend, backend, K8s API, and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-netpol
  namespace: sneakerhead-dev
  labels:
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  podSelector:
    matchLabels:
      app: sneakerhead-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept traffic from anywhere (external LB / NodePort)
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # To frontend
    - to:
        - podSelector:
            matchLabels:
              tier: frontend
      ports:
        - protocol: TCP
          port: 80
    # To backend services
    - to:
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8003
    # To kgateway controller (xDS config) in kgateway-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kgateway-system
      ports:
        - protocol: TCP
          port: 9977
    # To Kubernetes API server (gateway controller needs this)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Frontend: ingress from gateway only, egress to kube-dns only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-netpol
  namespace: sneakerhead-dev
  labels:
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  podSelector:
    matchLabels:
      tier: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sneakerhead-gateway
      ports:
        - protocol: TCP
          port: 80
  egress:
    # kube-dns only
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Backend: ingress from gateway only, egress to tier:data, tier:backend, and kube-dns
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-netpol
  namespace: sneakerhead-dev
  labels:
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sneakerhead-gateway
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8003
  egress:
    # To database tier
    - to:
        - podSelector:
            matchLabels:
              tier: data
      ports:
        - protocol: TCP
          port: 5432
    # To other backend services (inter-service communication)
    - to:
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8003
    # kube-dns
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Data: ingress from tier:backend only, egress to kube-dns only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-netpol
  namespace: sneakerhead-dev
  labels:
    app.kubernetes.io/part-of: sneakerhead
    environment: dev
spec:
  podSelector:
    matchLabels:
      tier: data
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # kube-dns only
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
