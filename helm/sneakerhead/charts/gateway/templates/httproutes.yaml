{{- range .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.global.labels.partOf }}
    environment: {{ $.Values.global.environment }}
spec:
  parentRefs:
    - name: sneakerhead-gateway
      namespace: {{ $.Values.global.namespace }}
  rules:
    - matches:
        {{- range .paths }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      backendRefs:
        - name: {{ .backendService }}
          port: {{ .backendPort }}
{{- end }}
