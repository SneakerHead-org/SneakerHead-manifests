apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sneakerhead-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: sneakerhead-gateway
    app.kubernetes.io/part-of: {{ .Values.global.labels.partOf }}
    environment: {{ .Values.global.environment }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: http
      protocol: {{ .Values.listenerProtocol }}
      port: {{ .Values.listenerPort }}
      allowedRoutes:
        namespaces:
          from: Same
