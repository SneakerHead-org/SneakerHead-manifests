apiVersion: v2
name: sneakerhead
description: SneakerHead microservices umbrella Helm chart
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: frontend
    version: 1.0.0
    condition: frontend.enabled
  - name: user-service
    version: 1.0.0
    condition: user-service.enabled
  - name: product-service
    version: 1.0.0
    condition: product-service.enabled
  - name: order-service
    version: 1.0.0
    condition: order-service.enabled
  - name: user-postgres
    version: 1.0.0
    condition: user-postgres.enabled
  - name: product-postgres
    version: 1.0.0
    condition: product-postgres.enabled
  - name: order-postgres
    version: 1.0.0
    condition: order-postgres.enabled
  - name: gateway
    version: 1.0.0
    condition: gateway.enabled
  - name: network-policies
    version: 1.0.0
    condition: network-policies.enabled
  - name: rbac
    version: 1.0.0
    condition: rbac.enabled
