# ═══════════════════════════════════════════════════════════════
# AppProject — Application Tier (Microservices + Gateway)
# ═══════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sneakerhead-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sneakerhead
spec:
  description: Application tier — microservices, frontend, and gateway

  sourceRepos:
    - https://github.com/SneakerHead-org/SneakerHead-manifests

  destinations:
    - server: https://kubernetes.default.svc
      namespace: sneakerhead-dev
    - server: https://kubernetes.default.svc
      namespace: sneakerhead-prod

  # No cluster-scoped resources needed for application tier
  clusterResourceWhitelist: []

  # Exact resource kinds rendered by frontend, gateway, user-service,
  # product-service, order-service sub-charts
  namespaceResourceWhitelist:
    # deployment.yaml (all 4 services + frontend)
    - group: apps
      kind: Deployment
    # Pods created by Deployments — ArgoCD health checks track these
    - group: ""
      kind: Pod
    # service.yaml (all 5 charts)
    - group: ""
      kind: Service
    # configmap.yaml (frontend, user-service, product-service, order-service)
    - group: ""
      kind: ConfigMap
    # secret.yaml (user-service, product-service, order-service)
    - group: ""
      kind: Secret
    # hpa.yaml (frontend only — autoscaling/v2)
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    # gateway.yaml (gateway sub-chart)
    - group: gateway.networking.k8s.io
      kind: Gateway
    # httproutes.yaml (gateway sub-chart)
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
