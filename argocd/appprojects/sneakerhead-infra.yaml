# ═══════════════════════════════════════════════════════════════
# AppProject — Infrastructure (RBAC + Network Policies)
# ═══════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sneakerhead-infra
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sneakerhead
spec:
  description: Infrastructure resources — RBAC and Network Policies

  sourceRepos:
    - https://github.com/SneakerHead-org/SneakerHead-manifests

  destinations:
    - server: https://kubernetes.default.svc
      namespace: sneakerhead-dev
    - server: https://kubernetes.default.svc
      namespace: sneakerhead-prod

  # Cluster-scoped resources needed for Headlamp namespace dropdown (ClusterRole/ClusterRoleBinding)
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  # Exact resource kinds rendered by rbac + network-policies sub-charts
  namespaceResourceWhitelist:
    # network-policies sub-chart
    - group: networking.k8s.io
      kind: NetworkPolicy
    # rbac sub-chart
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
