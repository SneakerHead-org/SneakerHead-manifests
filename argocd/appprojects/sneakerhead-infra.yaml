# ═══════════════════════════════════════════════════════════════
# AppProject — Infrastructure (RBAC + Network Policies)
# ═══════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sneakerhead-infra
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sneakerhead
spec:
  description: Infrastructure resources — RBAC and Network Policies

  # Only allow this specific Git repository as a source
  sourceRepos:
    - https://github.com/SneakerHead-org/SneakerHead-manifests

  # Restrict deployments to SneakerHead namespaces
  destinations:
    - server: https://kubernetes.default.svc
      namespace: sneakerhead-dev
    - server: https://kubernetes.default.svc
      namespace: sneakerhead-prod

  # Only allow infrastructure-related resource types
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
