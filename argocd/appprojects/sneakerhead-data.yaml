# ═══════════════════════════════════════════════════════════════
# AppProject — Data Tier (PostgreSQL Databases)
# ═══════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sneakerhead-data
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sneakerhead
spec:
  description: Data tier — PostgreSQL database StatefulSets

  sourceRepos:
    - https://github.com/SneakerHead-org/SneakerHead-manifests

  destinations:
    - server: https://kubernetes.default.svc
      namespace: sneakerhead-dev
    - server: https://kubernetes.default.svc
      namespace: sneakerhead-prod

  # PersistentVolumes are cluster-scoped but managed by the StorageClass,
  # not directly by these charts. PVCs from volumeClaimTemplates are
  # namespace-scoped and tracked by ArgoCD via the StatefulSet.
  clusterResourceWhitelist: []

  # Exact resource kinds rendered by user-postgres, product-postgres,
  # order-postgres sub-charts
  namespaceResourceWhitelist:
    # statefulset.yaml
    - group: apps
      kind: StatefulSet
    # Pods created by StatefulSet — ArgoCD health checks track these
    - group: ""
      kind: Pod
    # service.yaml
    - group: ""
      kind: Service
    # config.yaml (two docs: ConfigMap + SealedSecret)
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    # SealedSecret CRD rendered by Helm; controller creates the actual Secret
    - group: bitnami.com
      kind: SealedSecret
    # volumeClaimTemplates inside StatefulSet creates PVCs
    - group: ""
      kind: PersistentVolumeClaim
